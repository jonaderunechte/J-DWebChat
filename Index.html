<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e5ddd5;
            height: 100vh;
            overflow: hidden;
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-box button:hover {
            background: #1fb855;
        }

        .chat-container {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 20px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header button {
            padding: 8px 15px;
            background: #128c7e;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .header button:hover {
            background: #0f7a6f;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            background: #ededed;
            border-bottom: 1px solid #ddd;
        }

        .sidebar-header input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-item:hover {
            background: #f5f5f5;
        }

        .chat-item.active {
            background: #ebebeb;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-preview {
            font-size: 14px;
            color: #666;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 8px 12px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: #dcf8c6;
        }

        .message.other .message-bubble {
            background: white;
        }

        .message-sender {
            font-weight: bold;
            font-size: 13px;
            color: #075e54;
            margin-bottom: 3px;
        }

        .message-text {
            margin-bottom: 3px;
        }

        .message-time {
            font-size: 11px;
            color: #667781;
            text-align: right;
        }

        .message-image, .message-video {
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .message-file {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .message-link {
            color: #039be5;
            text-decoration: underline;
        }

        .input-area {
            background: #f0f0f0;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
        }

        .input-area input[type="file"] {
            display: none;
        }

        .input-area button {
            padding: 10px 15px;
            background: #25d366;
            border: none;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-area button:hover {
            background: #1fb855;
        }

        .file-btn {
            background: #128c7e !important;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #667781;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .chat-area {
                display: none;
            }
            .chat-area.active {
                display: flex;
            }
            .sidebar.hidden {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>💬 Chat App</h1>
            <p>Gib deinen Benutzernamen ein, um zu starten</p>
            <input type="text" id="usernameInput" placeholder="Benutzername">
            <button onclick="login()">Chat starten</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="header">
            <h2>Chat App</h2>
            <div class="header-buttons">
                <span id="currentUser"></span>
                <button onclick="logout()">Abmelden</button>
            </div>
        </div>
        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <input type="text" id="newChatInput" placeholder="Username für neuen Chat eingeben...">
                    <button onclick="startNewChat()" style="margin-top: 10px; width: 100%; padding: 10px; background: #25d366; color: white; border: none; border-radius: 5px; cursor: pointer;">Neuer Chat</button>
                </div>
                <div class="chat-list" id="chatList">
                    <div class="chat-item" onclick="selectChat('global')">
                        <div class="chat-avatar">🌍</div>
                        <div class="chat-info">
                            <div class="chat-name">Globaler Chat</div>
                            <div class="chat-preview">Öffentlicher Gruppencha</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="chat-area" id="chatArea">
                <div class="empty-state">
                    <h2>Willkommen!</h2>
                    <p>Wähle einen Chat aus oder starte einen neuen</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase-Konfiguration - ERSETZE DIESE WERTE MIT DEINEN EIGENEN!
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, set, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "DEINE_API_KEY",
            authDomain: "DEIN_PROJECT.firebaseapp.com",
            databaseURL: "https://DEIN_PROJECT.firebaseio.com",
            projectId: "DEIN_PROJECT_ID",
            storageBucket: "DEIN_PROJECT.appspot.com",
            messagingSenderId: "DEINE_SENDER_ID",
            appId: "DEINE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentUser = '';
        let currentChat = '';
        let messageListeners = {};

        window.login = function() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                currentUser = username;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('currentUser').textContent = currentUser;
                loadChats();
            } else {
                alert('Bitte gib einen Benutzernamen ein!');
            }
        };

        window.logout = function() {
            currentUser = '';
            currentChat = '';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('usernameInput').value = '';
        };

        window.startNewChat = function() {
            const otherUser = document.getElementById('newChatInput').value.trim();
            if (otherUser && otherUser !== currentUser) {
                const chatId = getChatId(currentUser, otherUser);
                selectChat(chatId, otherUser);
                document.getElementById('newChatInput').value = '';
            } else {
                alert('Bitte gib einen gültigen Benutzernamen ein!');
            }
        };

        function getChatId(user1, user2) {
            return [user1, user2].sort().join('_');
        }

        function loadChats() {
            // Später könnten hier auch private Chats geladen werden
        }

        window.selectChat = function(chatId, otherUser = null) {
            currentChat = chatId;
            
            // Aktiviere Chat-Item
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            event?.target.closest('.chat-item')?.classList.add('active');

            // Zeige Chat-Area
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="chat-avatar">${chatId === 'global' ? '🌍' : otherUser?.charAt(0).toUpperCase() || '👤'}</div>
                    <div class="chat-name">${chatId === 'global' ? 'Globaler Chat' : otherUser || chatId}</div>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
                <div class="input-area">
                    <input type="file" id="fileInput" accept="image/*,video/*,*/*" onchange="handleFileUpload(event)">
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="text" id="messageInput" placeholder="Nachricht eingeben..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">📤</button>
                </div>
            `;

            loadMessages(chatId);
        };

        function loadMessages(chatId) {
            // Remove old listener
            if (messageListeners[chatId]) {
                // Firebase listeners werden automatisch durch onValue verwaltet
            }

            const messagesRef = ref(db, `chats/${chatId}/messages`);
            const messagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(100));
            
            messageListeners[chatId] = onValue(messagesQuery, (snapshot) => {
                const container = document.getElementById('messagesContainer');
                if (!container) return;
                
                container.innerHTML = '';
                
                snapshot.forEach((childSnapshot) => {
                    const message = childSnapshot.val();
                    displayMessage(message);
                });

                container.scrollTop = container.scrollHeight;
            });
        }

        function displayMessage(message) {
            const container = document.getElementById('messagesContainer');
            const isOwn = message.sender === currentUser;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
            
            let content = '';
            
            if (!isOwn && currentChat === 'global') {
                content += `<div class="message-sender">${message.sender}</div>`;
            }

            if (message.type === 'text') {
                const text = linkify(message.text);
                content += `<div class="message-text">${text}</div>`;
            } else if (message.type === 'image') {
                content += `<img src="${message.url}" class="message-image" alt="Bild">`;
            } else if (message.type === 'video') {
                content += `<video src="${message.url}" class="message-video" controls></video>`;
            } else if (message.type === 'file') {
                content += `<div class="message-file">📄 <a href="${message.url}" target="_blank">${message.fileName}</a></div>`;
            }

            content += `<div class="message-time">${new Date(message.timestamp).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})}</div>`;
            
            messageDiv.innerHTML = `<div class="message-bubble">${content}</div>`;
            container.appendChild(messageDiv);
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, (url) => {
                return `<a href="${url}" class="message-link" target="_blank">${url}</a>`;
            });
        }

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentChat) return;

            const message = {
                sender: currentUser,
                text: text,
                type: 'text',
                timestamp: Date.now()
            };

            await push(ref(db, `chats/${currentChat}/messages`), message);
            input.value = '';
        };

        window.handleFileUpload = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileRef = storageRef(storage, `files/${currentChat}/${Date.now()}_${file.name}`);
            
            try {
                await uploadBytes(fileRef, file);
                const url = await getDownloadURL(fileRef);

                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('video/')) type = 'video';

                const message = {
                    sender: currentUser,
                    type: type,
                    url: url,
                    fileName: file.name,
                    timestamp: Date.now()
                };

                await push(ref(db, `chats/${currentChat}/messages`), message);
            } catch (error) {
                alert('Fehler beim Hochladen der Datei: ' + error.message);
            }

            event.target.value = '';
        };
    </script>
</body>
</html>
